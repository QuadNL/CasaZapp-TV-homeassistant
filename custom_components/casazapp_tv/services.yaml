record:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: casazapp_tv
    channel_id:
      required: true
      example: 1
      selector:
        number:
          min: 1
          mode: box
    minutes:
      example: 60
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: min
          mode: box
    start:
      selector:
        datetime:
    stop:
      selector:
        datetime:
    title:
      selector:
        text:
    takeover:
      default: false
      selector:
        boolean:

stop_recording:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: casazapp_tv
    recording_id:
      required: true
      selector:
        number:
          min: 1
          mode: box

delete_recording:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: casazapp_tv
    recording_id:
      required: true
      selector:
        number:
          min: 1
          mode: box

stop_stream:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: casazapp_tv
    stream_id:
      required: true
      selector:
        text:
